version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: downtime_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_postgres_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${DB_PASSWORD:-change_me_postgres_pass}@postgres:5432/downtime_tracker"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_FORUM_CHAT_ID: ${TELEGRAM_FORUM_CHAT_ID:-0}
      TOPIC_MAINTENANCE: ${TOPIC_MAINTENANCE:-0}
      TOPIC_PROCESS: ${TOPIC_PROCESS:-0}
      TOPIC_PRODUCTION: ${TOPIC_PRODUCTION:-0}
      TOPIC_QUALITY: ${TOPIC_QUALITY:-0}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars!!}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost"]'
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: