name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: downtime_tracker
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Static Python checks
        working-directory: ./backend
        run: |
          source venv/bin/activate
          ruff check app --select E9,F63,F7,F82
          python -m compileall -q app

      - name: Audit Python dependencies
        working-directory: ./backend
        run: |
          source venv/bin/activate
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Verify PostgreSQL migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/downtime_tracker
          JWT_SECRET: test-secret-key-for-testing-only-32-chars-minimum-length
          DEBUG: false
          RUN_BACKGROUND_WORKERS: false
        run: |
          source venv/bin/activate
          if [ -f alembic.ini ] && [ -d alembic ]; then
            alembic upgrade head
            alembic current
            alembic check
          else
            echo "No Alembic configuration committed; skipping migration check."
          fi
          if [ -f tests/integration/test_postgres_runtime.py ]; then
            pytest tests/integration/test_postgres_runtime.py -v
          else
            echo "No PostgreSQL runtime test committed; skipping integration test."
          fi
      
      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/downtime_tracker
          JWT_SECRET: test-secret-key-for-testing-only-32-chars-minimum-length
          TELEGRAM_BOT_TOKEN: dummy
          TELEGRAM_FORUM_CHAT_ID: 0
          DEBUG: true
          RUN_BACKGROUND_WORKERS: false
        run: |
          source venv/bin/activate
          if [ -d tests ]; then
            pytest tests/ -v --ignore=tests/integration/test_postgres_runtime.py --cov=app --cov-report=xml
          else
            echo "No backend tests committed; skipping pytest."
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend

  # Frontend Tests & Build
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npm install -g npm@11.14.1
      
      - name: Run linter
        working-directory: ./frontend
        run: npm run lint

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high
      
      - name: Run type check
        working-directory: ./frontend
        run: npx tsc --noEmit
      
      - name: Build production
        working-directory: ./frontend
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # Security Scan
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Docker Build (optional)
  docker-build:
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}-frontend
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
